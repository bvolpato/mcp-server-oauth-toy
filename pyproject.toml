[project]
name = "mcp-server-oauth-toy"
version = "0.1.0"
description = "A toy MCP server with OAuth authentication for testing mcp-cli OAuth support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.28.0",
    "uvicorn>=0.34.0",
    "starlette>=0.45.0",
    "python-jose>=3.3.0",
    "authlib>=1.5.0",
    "redis>=5.0.0",
]

[project.scripts]
mcp-server-oauth-toy = "mcp_server_oauth_toy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_oauth_toy"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
